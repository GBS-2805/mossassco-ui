var sheet=document.getElementById('sheet'),cur=0;
function pvBody(r){
  var v=r.view;
  if(v.t==='type')return '<div class="pv"><div class="tag">'+r.cap+'</div><div class="word" style="font-family:\''+v.fam+'\'">'+r.n+'</div></div>';
  if(v.t==='icons'){var ext=v.base.indexOf('simpleicons')>-1?'':'.svg',ns=v.names,h='<div class="pv">';ns.forEach(function(n){h+='<img src="'+v.base+n+ext+'" alt="">'});return h+'</div>'}
  if(v.t==='img'&&!v.src)return '<div class="pv"><span>RENDERS CANNOT BE REPUBLISHED<br>— SO THERE IS NOTHING HONEST TO SHOW</span></div>';
  if(v.t==='img')return '<div class="pv"><img src="'+v.src+'" alt=""'+(r.pos?' style="object-position:'+r.pos+'"':'')+'></div>';
  return '<div class="pv"></div>';
}
function frameHTML(r){
  var v=r.view,c='frame';
  if(v.t==='type'){var L=r.n.length;c+=' type w-'+(L<=7?'lg':(L<=13?'md':'sm'))}
  if(v.t==='icons')c+=' icons'+(v.names.length<12?' five':'')+(v.base.indexOf('simpleicons')>-1?' brand':'');
  if(v.t==='img')c+=' img '+(v.fit?'fit ':'')+(v.card?'card':'');
  if(v.t==='mesh')c+=' mesh';
  if(v.t==='img'&&!v.src)c+=' void';
  return '<div class="'+c+'">'+pvBody(r)+'</div>';
}
var GROUPS=[['type','Type'],['icons','Icons'],['3D','3D objects'],['image','Image'],['sites','Sites'],['plugins','Plugins'],['tools','Tools']];
var groupsEl=document.getElementById('groups');
GROUPS.forEach(function(g){
  var idxs=[];I.forEach(function(r,i){if(r.k===g[0])idxs.push(i)});
  if(!idxs.length)return;
  var sec=document.createElement('section');sec.className='group';sec.dataset.kind=g[0];
  sec.innerHTML='<div class="gh"><h2>'+g[1]+'</h2><span>'+String(idxs.length).padStart(2,'0')+'</span><i></i></div><div class="wall"></div>';
  var w=sec.querySelector('.wall');
  idxs.forEach(function(i){
    var r=I[i],el=document.createElement('div');el.className='item';el.dataset.kind=r.k;
    el.innerHTML=frameHTML(r)+'<div class="cap"><b>'+r.n+'</b><i>'+r.k+'</i></div><div class="sub">'+r.lic+'</div>';
    el.onclick=function(){openTab(i)};
    w.appendChild(el);
  });
  groupsEl.appendChild(sec);
});
document.querySelector('.meta').textContent=I.length+' items · '+document.querySelectorAll('.group').length+' sections · reviewed licence by licence';
var kinds=['all'].concat(GROUPS.map(function(g){return g[0]})),kb=document.getElementById('kinds');
kinds.forEach(function(k,idx){
  var b=document.createElement('button');b.textContent=k;if(idx===0)b.className='on';
  b.onclick=function(){
    [].forEach.call(kb.children,function(c){c.classList.remove('on')});b.classList.add('on');
    [].forEach.call(groupsEl.children,function(sec){sec.style.display=(k==='all'||sec.dataset.kind===k)?'':'none'});
  };
  kb.appendChild(b);
});
function openTab(i){
  cur=i;var r=I[i],n=I.length;
  sheet.innerHTML='<div class="bar"><span class="dot"></span><b>'+r.n+'</b><span>'+r.k+'</span><span class="sp"></span><span>'+String(i+1).padStart(2,'0')+' / '+String(n).padStart(2,'0')+'</span><button onclick="closeTab()">close ✕</button></div>'+
  '<div class="body"><div class="preview">'+frameHTML(r)+'<div class="pcap">'+r.cap+'</div></div>'+
  '<div class="info"><div class="k">'+r.cap+'</div><h1>'+r.n+'</h1><p class="lead">'+r.lead+'</p>'+
  '<div class="sec"><span class="lab">about</span><p>'+r.about+'</p></div>'+
  '<div class="sec"><span class="lab">use it for</span><ul>'+r.use.map(function(u){return '<li>'+u+'</li>'}).join('')+'</ul></div>'+
  '<div class="sec"><span class="lab">watch out</span><p class="watch">'+r.watch+'</p></div>'+
  '<div class="sec"><span class="lab">the facts</span>'+
    '<div class="kv"><span>licence</span><b>'+r.lic+'</b></div>'+
    '<div class="kv"><span>download</span><b>'+r.dl+'</b></div>'+
    '<div class="kv"><span>format</span><b>'+r.fmt+'</b></div>'+
    '<div class="kv"><span>size</span><b>'+r.size+'</b></div>'+
    '<div class="kv"><span>source</span><b>'+r.host+'</b></div>'+
  '</div>'+
  '<div class="cta"><a class="go" href="'+r.href+'" target="_blank" rel="noopener">open '+r.host+' ↗</a><button class="next" onclick="step(1)">next item →</button></div>'+
  '</div></div>';
  sheet.classList.add('on');document.body.style.overflow='hidden';
}
function step(d){cur=(cur+d+I.length)%I.length;openTab(cur)}
function closeTab(){sheet.classList.remove('on');sheet.innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',function(e){
  if(!sheet.classList.contains('on'))return;
  if(e.key==='Escape')closeTab();
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
});
</script></body></html>
