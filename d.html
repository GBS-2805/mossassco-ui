    sw.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sw.blur()}});
    sw.addEventListener('input',function(){
      ptext=sw.textContent.replace(/\s+/g,' ').trim();
      var inp=document.querySelector('.gh .txt');if(inp)inp.value=ptext;
      [].forEach.call(groupsEl.querySelectorAll('.item[data-kind="type"] .word'),function(w){w.textContent=ptext||I[+w.closest('.item').dataset.i].n});
      fitTypes();fitSites();
    });
  }
  sheet.classList.add('on');document.body.style.overflow='hidden';
  fitTypes(sheet);fitSites(sheet);
  var b=sheet.querySelector('.body');if(b)b.scrollTop=0;
}
function step(d){cur=(cur+d+I.length)%I.length;openTab(cur)}
function hideSheet(){sheet.classList.remove('on');sheet.innerHTML='';document.body.style.overflow=''}
function closeTab(){if(histPushed){histPushed=false;history.back()}hideSheet()}
window.addEventListener('popstate',function(){if(sheet.classList.contains('on')){histPushed=false;hideSheet()}});
document.addEventListener('keydown',function(e){
  if(!sheet.classList.contains('on'))return;
  if(e.key==='Escape')closeTab();
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
});
</script></body></html>
