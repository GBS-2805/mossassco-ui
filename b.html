<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B · the dial</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2f0e9;--ink:#141412;--dim:#8b887d;--line:rgba(20,20,18,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.top{display:flex;justify-content:space-between;padding:18px 0;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);border-bottom:1px solid var(--line)}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(26px,4vw,40px);margin:22px 0 0;letter-spacing:-.02em}
h1 em{font-style:italic;color:#57544b}
.stage{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:center;margin-top:10px}
.dialwrap{position:relative;width:min(520px,92vw);aspect-ratio:1/1;margin:0 auto}
.ring{position:absolute;inset:8%;border:1px solid var(--line);border-radius:50%}
.ring2{position:absolute;inset:0;border:1px dashed rgba(20,20,18,.1);border-radius:50%}
.hub{position:absolute;inset:28%;border-radius:50%;background:#131311;color:#f6f4ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8%;overflow:hidden}
.hub .nm{font-family:"Instrument Serif",serif;font-size:26px;line-height:1}
.hub .lic{font-size:8.5px;letter-spacing:.16em;color:#a9a79c;text-transform:uppercase}
.hub img{width:46%;filter:invert(1);opacity:.9}
.node{position:absolute;left:50%;top:50%;width:96px;margin:-8px 0 0 -48px;text-align:center;cursor:pointer;background:none;border:0;font:inherit;color:inherit;padding:4px 0;transition:transform .25s ease}
.node b{display:block;font-size:10.5px;letter-spacing:-.01em;font-weight:400}
.node span{display:block;font-size:8px;color:var(--dim);letter-spacing:.1em;margin-top:2px}
.node.on b{color:#141412;background:#c8f14a;padding:2px 4px;border-radius:3px}
.node:hover b{text-decoration:underline}
.side .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.side h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:34px;margin:4px 0 8px;line-height:1}
.side p{font-family:Satoshi,system-ui,sans-serif;font-size:13px;line-height:1.55;color:#55524a;margin:0 0 14px}
.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:7px 0;font-size:10.5px}
.row span{color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-size:9px}
.acts{margin-top:16px;display:flex;gap:8px}
.btn{font:inherit;font-size:10.5px;text-decoration:none;border:1px solid var(--ink);padding:8px 12px;color:var(--ink)}
.btn.p{background:var(--ink);color:var(--paper)}
.nav{margin-top:26px;font-size:10px;color:var(--dim)}
.nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);margin-right:12px}
@media(max-width:780px){.stage{grid-template-columns:1fr}.hub .nm{font-size:20px}}
</style></head><body><div class="wrap">
<div class="top"><span>mossassco parts</span><span>b · the dial</span></div>
<h1>Eight parts on a <em>round dial.</em></h1>
<div class="stage">
  <div class="dialwrap" id="dial">
    <div class="ring2"></div><div class="ring"></div>
    <div class="hub" id="hub"><div class="nm" id="hn">Fontshare</div><div class="lic" id="hl">ITF Free</div></div>
  </div>
  <div class="side">
    <div class="k" id="sk">type</div>
    <h2 id="sn">Fontshare</h2>
    <p id="sp">Satoshi, General Sans, Switzer. The best free UI faces right now.</p>
    <div class="row"><span>part</span><b id="sr">MS-02</b></div>
    <div class="row"><span>download</span><b id="sd">click-through</b></div>
    <div class="row"><span>licence</span><b id="sl">ITF Free · commercial</b></div>
    <div class="acts"><a class="btn p" id="sa" href="https://www.fontshare.com" target="_blank">Open source</a><a class="btn" href="#">+ kit</a></div>
  </div>
</div>
<div class="nav">other directions <a href="a.html">a · the palette</a><a href="c.html">c · the front page</a></div>
</div>
<script>
var D=[
{n:"MS-01",name:"Google Fonts",kind:"font",fam:"Inter",lic:"OFL / Apache",dl:"direct .zip",url:"https://fonts.google.com",p:"1,800 open families. Start here."},
{n:"MS-02",name:"Fontshare",kind:"font",fam:"Satoshi",lic:"ITF Free · commercial",dl:"click-through",url:"https://www.fontshare.com",p:"Satoshi, General Sans, Switzer. The best free UI faces right now."},
{n:"MS-07",name:"Unsplash",kind:"img",img:"https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=400&q=70",lic:"no resale",dl:"click-through",url:"https://unsplash.com",p:"Soft light, interiors, atmosphere."},
{n:"MS-13",name:"Poly Haven",kind:"img",img:"https://cdn.polyhaven.com/asset_img/thumbs/potted_plant_01.png?width=400&height=400",lic:"CC0",dl:"direct asset url",url:"https://polyhaven.com",p:"Public domain HDRIs, models and textures."},
{n:"MS-17",name:"Lucide",kind:"icons",lic:"ISC",dl:"direct zip",url:"https://lucide.dev",p:"1.5px stroke at 24px. The default set here."},
{n:"MS-12",name:"Shapefest",kind:"dead",lic:"512px free",dl:"click-through",url:"https://shapefest.com",p:"Renders can't be republished, so no preview."},
{n:"MS-21",name:"MeshSVG",kind:"none",lic:"free tool",dl:"browser tool",url:"https://meshsvg.com",p:"Draw a grainy mesh, copy the CSS out."},
{n:"MS-27",name:"Are.na",kind:"none",lic:"look only",dl:"reference",url:"https://www.are.na",p:"Where designers keep their working references."}
];
var cur=1,dial=document.getElementById('dial'),hub=document.getElementById('hub');
D.forEach(function(r,i){
  var b=document.createElement('button');b.className='node';
  b.innerHTML='<b>'+r.name+'</b><span>'+r.n.replace('MS-','')+'</span>';
  b.onclick=function(){cur=i;layout();show()};
  dial.appendChild(b);
});
function layout(){
  var n=D.length,step=360/n,rot=-cur*step;
  [].forEach.call(dial.querySelectorAll('.node'),function(b,i){
    var a=i*step+rot;
    b.style.transform='rotate('+a+'deg) translateY(-38%) rotate('+(-a)+'deg)';
    if(i===cur)b.classList.add('on');else b.classList.remove('on');
  });
}
function show(){
  var r=D[cur];
  document.getElementById('sk').textContent=r.kind==='font'?'type':r.kind==='img'?'image':'record';
  document.getElementById('sn').textContent=r.name;
  document.getElementById('sp').textContent=r.p;
  document.getElementById('sr').textContent=r.n;
  document.getElementById('sd').textContent=r.dl;
  document.getElementById('sl').textContent=r.lic;
  document.getElementById('sa').href=r.url;
  if(r.kind==='font'){hub.innerHTML='<div class="nm" style="font-family:\''+r.fam+'\'">Aa</div><div class="lic">'+r.lic+'</div>'}
  else if(r.kind==='img'){hub.innerHTML='<img src="'+r.img+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'}
  else if(r.kind==='icons'){hub.innerHTML='<img src="https://unpkg.com/lucide-static/icons/heart.svg">'}
  else if(r.kind==='dead'){hub.innerHTML='<div class="nm" style="font-size:11px;letter-spacing:.2em">NO SIGNAL</div>'}
  else {hub.innerHTML='<div class="nm" style="font-size:10px;letter-spacing:.2em;line-height:2">NO BOARD<br>PREVIEW</div>'}
}
layout();show();
</script></body></html>
