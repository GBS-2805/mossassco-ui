<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>color wheel mock v2 — shelf</title>
<style>
  :root{--bg:#0b0b0d;--ink:#f4f3ee;--lime:#c8f14a;--line:#26262b;--mono:'Courier New',ui-monospace,monospace}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#161618;color:var(--ink);font-family:var(--mono)}
  @font-face{font-family:'Hask\u00f6y';src:url('../fonts/haskoy.woff2') format('woff2');font-weight:100 800;font-display:swap}
  .stage{position:relative;width:390px;margin:0 auto;background:var(--bg);min-height:780px;overflow:hidden;outline:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column}

  /* ---- pane, same bones as the live home ---- */
  .pane{position:relative;flex:1;min-height:430px;margin:0;background:#0e0e10;overflow:hidden;border-bottom:1px solid var(--line)}

  /* categories pulldown, top right — exactly the live control */
  .hpages{position:absolute;top:8px;right:8px;z-index:8}
  .hpages>button{background:rgba(8,8,10,.55);border:0;padding:10px 12px;min-height:40px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8a8a92;cursor:pointer}
  .hpages>button b{color:var(--ink);font-weight:400;margin-right:6px}
  .hmenu{position:absolute;top:50px;right:0;width:200px;max-height:54vh;overflow-y:auto;background:rgba(8,8,10,.94);border:1px solid var(--line);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .15s,transform .15s}
  .hmenu.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .hmenu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:44px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a92;cursor:pointer}
  .hmenu button:last-child{border-bottom:0}
  .hmenu button.on{color:var(--ink);box-shadow:inset 2px 0 0 var(--lime)}

  /* specimen word */
  .word{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);line-height:1.05;font-weight:400;color:var(--ink);overflow:hidden;text-align:center;font-family:'Hask\u00f6y',var(--mono);font-synthesis:none;transition:color .18s ease}
  .word .n{display:block;font-size:64px;white-space:nowrap;letter-spacing:-.035em}
  .word .s{display:block;white-space:pre-line;line-height:1.15;margin-top:.38em;font-size:18px;color:inherit;opacity:.92}

  /* icons: 15 per set, each in its own invisible, non-overlapping cell */
  .iconspane{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);display:none}
  .icons .pv{display:grid;grid-template-columns:repeat(5,1fr);row-gap:16px}
  .icons .cell{aspect-ratio:1;display:grid;place-items:center;padding:15%;border-radius:12px;min-width:0;min-height:0}
  .pane.picking .cell{outline:1px dashed rgba(244,243,238,.16);outline-offset:-3px}
  .icons .mk{width:100%;height:100%;background:var(--iconcol,#fff);-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;transition:background .18s ease}
  .icnote{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font-family:var(--mono);font-size:10px;color:#8a8a92;letter-spacing:.12em;text-transform:uppercase}

  /* dials, bottom LEFT as asked */
  .hdials{position:absolute;bottom:10px;left:10px;z-index:6;display:flex;flex-direction:column;gap:7px;background:rgba(8,8,10,.55);border:0;border-radius:10px;padding:9px 10px 10px}
  .hdials label{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a92;margin-bottom:4px}
  .hdials input[type=range]{width:104px;accent-color:var(--lime);height:18px;margin:0}

  /* ---- the liquid colour block, right side ---- */
  .ctab{position:absolute;right:4px;bottom:18px;z-index:10;width:52px;height:64px;border:0;padding:0;cursor:pointer;background:none;transition:transform .25s cubic-bezier(.2,.9,.25,1.25)}
  .ctab:active{transform:scale(.9)}
  .ctab .blobi{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:12px;color:#0b0b0d;background:var(--blockcol,#f4f3ee);border-radius:52% 48% 55% 45%/60% 58% 42% 40%;animation:idle 3.2s ease-in-out infinite;box-shadow:-2px 4px 18px rgba(0,0,0,.55)}
  @keyframes idle{
    0%,100%{border-radius:52% 48% 55% 45%/60% 58% 42% 40%}
    33%{border-radius:58% 42% 46% 54%/50% 62% 38% 50%}
    66%{border-radius:45% 55% 58% 42%/55% 45% 55% 45%}
  }

  /* ---- the wheel drawer: half disc, flat side against the right edge ---- */
  .cw{position:absolute;right:0;bottom:40px;z-index:9;transform-origin:100% 50%;display:none;clip-path:circle(131px at 100% 50%)}
  .cw.open{display:block;animation:blobIn .5s cubic-bezier(.2,.9,.25,1.15) both}
  .cw.closing{display:block;animation:blobOut .28s ease both}
  @keyframes blobIn{
    0%{transform:scale(.12,.42);opacity:0}
    38%{transform:scale(1.14,.86);opacity:1}
    62%{transform:scale(.9,1.08)}
    80%{transform:scale(1.04,.97)}
    100%{transform:scale(1,1);opacity:1}
  }
  @keyframes blobOut{
    0%{transform:scale(1,1);opacity:1}
    100%{transform:scale(.14,.5);opacity:0}
  }
  .cwbody{position:relative;width:130px;height:260px;border-radius:130px 0 0 130px;overflow:hidden;box-shadow:-10px 0 34px rgba(0,0,0,.6),inset -2px 0 0 rgba(255,255,255,.1);transform-origin:100% 50%;transition:transform .3s cubic-bezier(.2,.9,.25,1.1)}
  .cw.zoom .cwbody{transform:translateX(8px) scale(1.09)}
  canvas{display:block;width:130px;height:260px;touch-action:none;cursor:crosshair}
  .echo{position:absolute;width:44px;height:44px;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;filter:blur(1px)}
  .lens{position:absolute;width:52px;height:52px;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 6px 18px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
  .cwhex{position:absolute;left:12px;bottom:14px;background:rgba(8,8,10,.8);border:1px solid var(--line);border-radius:999px;color:var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 9px}
  .cwhint{position:absolute;left:12px;top:14px;background:rgba(8,8,10,.8);border:1px solid var(--line);border-radius:999px;color:#8a8a92;font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 9px}

  /* family wheel, bottom — same look as the live deck */
  .hdeck{flex:0 0 auto}
  #hfam{display:flex;align-items:center;height:64px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:0 38%;scroll-snap-type:x mandatory;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
  #hfam::-webkit-scrollbar{display:none}
  #hfam .opt{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;background:none;font-family:var(--mono);font-size:14px;letter-spacing:.02em;color:#8a8a92;white-space:nowrap;cursor:pointer;scroll-snap-align:center;transition:color .14s}
  #hfam .opt.on{color:var(--ink)}

  .hstrips{display:flex;justify-content:center;gap:6px;padding:0 12px 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hstrips::-webkit-scrollbar{display:none}
  .hstrips .strip{display:flex;gap:6px}
  .hstrips .opt{flex:0 0 auto;background:#141417;border:1px solid var(--line);border-radius:999px;color:#a2a2aa;font-family:var(--mono);font-size:10.5px;padding:6px 11px;cursor:pointer}
  .hstrips .opt.on{color:#0b0b0d;background:var(--lime);border-color:var(--lime)}
</style>
</head>
<body>
<div class="stage">
  <div class="pane" id="pane">
    <div class="hpages">
      <button id="hpagebtn" aria-expanded="false" aria-label="site area"><b>type</b> ▾</button>
      <div class="hmenu" id="hmenu" role="listbox" aria-label="site areas"></div>
    </div>

    <div class="word" id="word">
      <span class="n">0123456789</span>
      <span class="s">the quick brown fox jumps over the lazy dog</span>
    </div>

    <div class="iconspane icons" id="iconspane">
      <div class="pv" id="pv"></div>
      <span class="icnote">15 of 1,600 · cells invisible</span>
    </div>

    <div class="hdials" id="hdials">
      <label>track <span>-0.035em</span></label><input type="range" min="-8" max="50" step="1" value="-4" id="tr">
      <label>size <span>1.00</span></label><input type="range" min="40" max="100" step="1" value="88" id="sz">
    </div>

    <button class="ctab" id="ctab" aria-expanded="false" aria-label="colour wheel">
      <span class="blobi" id="blobi"><span>C</span></span>
    </button>

    <div class="cw" id="cw" role="dialog" aria-label="colour wheel">
      <div class="cwbody" id="cwbody">
        <canvas id="wheel" width="130" height="260"></canvas>
        <div class="echo" id="e1"></div><div class="echo" id="e2"></div>
        <div class="lens" id="lens"></div>
        <span class="cwhint">slide · lift to keep</span>
        <span class="cwhex" id="chex">#F4F3EE</span>
      </div>
    </div>
  </div>

  <div class="hdeck">
    <div id="hfam"></div>
    <div class="hstrips" id="hstrips"></div>
  </div>
</div>

<script>
/* ---------- categories pulldown, top right: the real list ---------- */
var CATS=[['type','Type'],['icons','Icons'],['3d-illust','Illust'],['3d-model','Model'],['image','Image'],['sites','Sites'],['plugins','Plugins'],['tools','Tools'],['all','All']];
var page='type',hmenu=document.getElementById('hmenu'),hpagebtn=document.getElementById('hpagebtn'),open=false;
function buildMenu(){var h='';CATS.forEach(function(c){h+='<button role="option"'+(c[0]===page?' class="on" aria-selected="true"':' aria-selected="false"')+' data-p="'+c[0]+'">'+c[1]+'</button>'});hmenu.innerHTML=h}
buildMenu();
hpagebtn.onclick=function(e){e.stopPropagation();var o=hmenu.classList.toggle('open');hpagebtn.setAttribute('aria-expanded',o);if(o)buildMenu()};
document.addEventListener('click',function(e){if(!e.target.closest('.hpages'))hmenu.classList.remove('open')});
hmenu.addEventListener('click',function(e){
  var o=e.target.closest('button');if(!o)return;
  if(o.dataset.p==='type'||o.dataset.p==='icons'){
    var toIcons=o.dataset.p==='icons';
    if(open)slideOpen(false);
    page=o.dataset.p;
    document.getElementById('iconspane').style.display=toIcons?'block':'none';
    document.getElementById('word').style.display=toIcons?'none':'block';
    document.getElementById('hdials').style.display=toIcons?'none':'flex';
    document.getElementById('hstrips').style.display=toIcons?'none':'flex';
    hpagebtn.innerHTML='<b>'+page+'</b> \u25be';buildMenu();
  }
  hmenu.classList.remove('open');
});

/* ---------- family wheel + cut strip ---------- */
var FAMS=['Aspekta','Giphurs','Hask\u00f6y','Geist','Commit Mono','Handjet'];
var hdots=[100,200,300,400,500,600,700,800],hdotsL=['Thin','ExtraLight','Light','Regular','Medium','SemiBold','Bold','ExtraBold'],hwi=3;
var BLOBS=['Thin 100','ExtraLight 200','Light 300','Regular 400','Medium 500','SemiBold 600','Bold 700','ExtraBold 800'];
var hfam=document.getElementById('hfam'),hstrips=document.getElementById('hstrips');
FAMS.forEach(function(f,j){var b=document.createElement('button');b.className='opt'+(j===2?' on':'');b.textContent=f;
  b.onclick=function(){[].forEach.call(hfam.children,function(c,k){c.classList.toggle('on',k===j)});hstrips.scrollLeft=0};hfam.appendChild(b)});
BLOBS.forEach(function(c,j){var b=document.createElement('button');b.className='opt'+(j===hwi?' on':'');b.textContent=c;
  b.onclick=function(){hwi=j;document.querySelector('.word .n').style.fontWeight=hdots[j];
    [].forEach.call(hstrips.querySelectorAll('.opt'),function(o,k){o.classList.toggle('on',k===j)})};hstrips.appendChild(b)});

/* icons: 15 per set, each in its own invisible cell */
var names=['heart','star','bell','camera','mail','lock','search','house','calendar','clock','user','bookmark','trash','play','settings'];
var pv=document.getElementById('pv');
names.forEach(function(n){var c=document.createElement('div');c.className='cell';
  var mk=document.createElement('i');mk.className='mk';
  mk.style.setProperty('--u','url(https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/'+n+'.svg)');
  c.appendChild(mk);pv.appendChild(c)});

/* ---------- dials really adjust ---------- */
var sz=document.getElementById('sz'),tr=document.getElementById('tr');
function dial(){var n=document.querySelector('.word .n');if(!n)return;
  n.style.transform='scale('+(sz.value/100)+')';n.style.letterSpacing=(tr.value/1000)+'em';}
sz.oninput=dial;tr.oninput=dial;

/* ---------- the half-disc colour wheel ---------- */
var INK='#f4f3ee';
var pane=document.getElementById('pane'),word=document.getElementById('word'),
    ctab=document.getElementById('ctab'),blobi=document.getElementById('blobi'),
    cw=document.getElementById('cw'),cwbody=document.getElementById('cwbody'),
    wheel=document.getElementById('wheel'),lens=document.getElementById('lens'),
    e1=document.getElementById('e1'),e2=document.getElementById('e2'),
    chex=document.getElementById('chex');
var ctx=wheel.getContext('2d'),R=130,CX=130,CY=130;
function hueAt(dx,dy){var a2=Math.atan2(dy,dx);if(a2>0)a2-=Math.PI*2;var t=(-Math.PI/2-a2)/Math.PI;return Math.max(0,Math.min(1,t))*330}
function hsl(h,s,l){function f(n){var k=(n+h/30)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))}return[f(0),f(8),f(4)]}
function hex(rgb){return'#'+rgb.map(function(v){return('0'+Math.round(255*Math.max(0,Math.min(1,v))).toString(16)).slice(-2)}).join('')}
function colorAt(px,py){var dx=px-CX,dy=py-CY,r=Math.min(Math.hypot(dx,dy),R-1),n=r/R;
  return hex(hsl(hueAt(dx,dy),.35+.65*n,.95-.48*n))}
(function draw(){var im=ctx.createImageData(130,260),d=im.data;
  for(var y=0;y<260;y++)for(var x=0;x<130;x++){var dx=x-CX,dy=y-CY,r=Math.hypot(dx,dy),i=(y*130+x)*4;
    if(r>R){d[i+3]=0;continue}
    var n=r/R,rgb=hsl(hueAt(dx,dy),.35+.65*n,.95-.48*n);
    d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255}
  ctx.putImageData(im,0,0)})();

/* liquid trail: the lens chases the finger on a spring, two echoes lag behind */
var spr={x:65,y:130,vx:0,vy:0},tg={x:65,y:130},hist=[],active=false;
function spring(){
  if(active){
    spr.vx+=(tg.x-spr.x)*.24;spr.vy+=(tg.y-spr.y)*.24;
    spr.vx*=.78;spr.vy*=.78;spr.x+=spr.vx;spr.y+=spr.vy;
  }
  var sc=Math.min(1,1+Math.hypot(spr.vx,spr.vy)*.01);
  lens.style.left=spr.x+'px';lens.style.top=spr.y+'px';
  lens.style.transform='translate(-50%,-50%) scale('+sc.toFixed(3)+')';
  e1.style.left=spr.x+'px';e1.style.top=spr.y+'px';
  e2.style.left=spr.x+'px';e2.style.top=spr.y+'px';
  e1.style.transform='translate(-50%,-50%) scale('+(sc*.82)+')';e1.style.opacity=active?.55:0;
  e2.style.transform='translate(-50%,-50%) scale('+(sc*.66)+')';e2.style.opacity=active?.3:0;
  requestAnimationFrame(spring);
}
requestAnimationFrame(spring);

function pick(px,py){var col=colorAt(px,py);
  chex.textContent=col.toUpperCase();
  lens.style.background=col;e1.style.background=col;e2.style.background=col;
  tg.x=px;tg.y=py;
  if(document.getElementById('word').style.display!=='none'){word.style.color=col}
  else{pv.style.setProperty('--iconcol',col)}
  blobi.parentElement.style.setProperty('--blockcol',col);
  document.getElementById('blobi').style.color=lum(col)>.55?'#0b0b0d':'#f4f3ee';
  chex.style.color='#f4f3ee';
  pane.classList.add('picking');
}
function lum(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return (r*.299+g*.587+b*.114)/255}
function slide(e){var r=wheel.getBoundingClientRect();if(!r.width)return;
  pick(Math.min(R,Math.max(4,(e.clientX-r.left)*130/r.width)),Math.min(256,Math.max(4,(e.clientY-r.top)*260/r.height)))}
wheel.addEventListener('pointerdown',function(e){cw.classList.add('zoom');active=true;try{wheel.setPointerCapture(e.pointerId)}catch(err){}slide(e)});
wheel.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')slide(e)});
wheel.addEventListener('pointerup',function(e){active=false;cw.classList.remove('zoom');pane.classList.remove('picking');slide(e)});
wheel.addEventListener('pointercancel',function(e){active=false;cw.classList.remove('zoom');pane.classList.remove('picking')});

/* open / pull in as a half circle; tap anywhere else on the pane to dismiss */
function slideOpen(v){open=v;ctab.setAttribute('aria-expanded',v);
  ctab.setAttribute('aria-label',v?'pull colour wheel in':'colour wheel');
  if(v){cw.classList.remove('closing');cw.classList.add('open')}
  else{cw.classList.remove('open');cw.classList.add('closing');active=false;
    setTimeout(function(){cw.classList.remove('closing');cw.classList.remove('zoom');pane.classList.remove('picking')},290)}}
ctab.onclick=function(){slideOpen(!open)};
pane.addEventListener('click',function(e){if(open&&!cw.contains(e.target)&&!ctab.contains(e.target)&&!e.target.closest('.hpages'))slideOpen(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open)slideOpen(false)});

/* reset to ink: long-press-ish — double tap the block */
blobi.ondblclick=function(){word.style.color=INK;chex.textContent='#F4F3EE';
  pv.style.setProperty('--iconcol','#fff');blobi.parentElement.style.setProperty('--blockcol',INK);
  blobi.style.color='#0b0b0d'};
</script>
</body>
</html>
