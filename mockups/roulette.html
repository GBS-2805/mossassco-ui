<title>Shelf — roulette home</title>
<style>
/* Throwaway mockup: roulette home. One face at a time, giant live specimen on top,
   vertical cut wheel inside the pane, family wheel + other categories at the bottom.
   d.html is untouched. Real FREE records + real cut coordinates. */
:root{
  --bg:#0a0a0c;--ink:#e9e8e3;--dim:#8d8d96;--faint:#5a5a63;
  --line:rgba(255,255,255,.12);--hair:rgba(255,255,255,.06);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
body{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- top pane: the live face ---- */
#pane{position:relative;flex:1 1 62%;min-height:0;border-bottom:1px solid var(--line);overflow:hidden}
#word{position:absolute;left:0;right:96px;top:50%;transform:translateY(-50%);
  padding:0 14px 0 18px;text-align:left;font-size:44px;line-height:1.04;
  transition:font-size .25s ease,opacity .25s ease;overflow-wrap:break-word}
#word.nofile{color:var(--faint)}
#cut{position:absolute;top:0;right:0;bottom:44px;width:96px;overflow-y:auto;overscroll-behavior:contain;
  scroll-snap-type:y mandatory;border-left:1px solid var(--hair);scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
#cut::-webkit-scrollbar{display:none}
#cut .it{display:flex;align-items:center;justify-content:flex-end;min-height:52px;
  padding:0 10px 0 6px;scroll-snap-align:center;color:var(--faint);font-size:9px;
  letter-spacing:.06em;text-align:right;transition:color .2s}
#cut .it span{overflow-wrap:anywhere}
#cut .it.mid{color:var(--ink)}
#cutmarker{position:absolute;right:0;bottom:44px;width:96px;height:0;
  border-top:1px solid var(--line);pointer-events:none}
#cutmarker{top:auto}
#cutdead{position:absolute;top:0;right:0;bottom:44px;width:96px;border-left:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;color:#3f3f46;font-size:9px;
  letter-spacing:.06em;text-align:right;padding:0 10px}
#meta{position:absolute;left:0;right:0;bottom:0;height:44px;border-top:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:var(--dim)}
#meta b{font-weight:400;color:var(--ink);font-size:10px}
#meta a{color:var(--dim);text-decoration:none}

/* ---- bottom: family roulette + everything else ---- */
#deck{flex:1 1 38%;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
#ptext{background:none;border:0;border-bottom:1px solid var(--hair);color:var(--ink);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:12px 18px;width:100%}
#ptext:focus-visible{outline:1px solid rgba(233,232,227,.55);outline-offset:-1px}
#fam{flex:1 1 auto;min-height:0;display:flex;align-items:center;overflow-x:auto;overscroll-behavior:contain;
  scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 40%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#fam::-webkit-scrollbar{display:none}
#fam .it{flex:0 0 auto;scroll-snap-align:center;padding:0 16px;color:var(--faint);
  font-size:17px;line-height:1;white-space:nowrap;transition:color .2s;cursor:pointer}
#fam .it.mid{color:var(--ink)}
#fammaker{position:relative;height:0;border-top:1px solid var(--line);margin:0 18px}
#cats{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--hair);color:var(--faint);font-size:9px}
#cats a{color:var(--faint);text-decoration:none;padding:8px 0;margin:-8px 0}
#cats a:first-child{color:var(--ink)}

  var asc = m.actualBoundingBoxAscent || 72, wid = m.width || word.textContent.length * 52;
  if (!W || W > 9000) return;
  var lines = Math.max(1, Math.ceil((wid * 0.62) / W));
  var per = wid / lines;
  var T = Math.min(W * 0.92 / (per / 100), (pane.clientHeight - 90) / (asc / 100) / lines * 0.8, 120);
  word.style.fontSize = Math.max(14, T * asc / 100 * 0.92).toFixed(1) + 'px';
}

function applyCut(i){
  var f = fam(cur), cuts = f.cuts;
  curCut = i;
  if (!cuts.length) return;
  var co = cuts[i].co || {};
  if ('wght' in co) word.style.fontWeight = co.wght;
  if ('ital' in co) word.style.fontStyle = co.ital ? 'italic' : 'normal';
  var rest = {}; for (var k in co) if (k !== 'wght' && k !== 'ital') rest[k] = co[k];
  var keys = Object.keys(rest);
  word.style.fontVariationSettings = keys.length ? keys.map(function(k){ return '"' + k + '" ' + rest[k]; }).join(', ') : '';
  fitWord();
}

function buildCut(){
  var f = fam(cur), cuts = f.cuts;
  cutEl.innerHTML = '';
  if (cuts.length > 1){
    cutDead.hidden = true; cutMarker.hidden = false; cutEl.hidden = false;
    cuts.forEach(function(c, i){
      var d = document.createElement('div');
      d.className = 'it'; d.innerHTML = '<span></span>';
      d.querySelector('span').textContent = c.label;
      d.addEventListener('click', function(){ snapTo(cutEl, d, 'top'); });
      cutEl.appendChild(d);
    });
    applyCut(Math.min(curCut, cuts.length - 1));
    markMid(cutEl);
  } else {
    cutEl.hidden = true; cutMarker.hidden = true; cutDead.hidden = false;
    cutDead.textContent = cuts.length ? cuts[0].label : (f.f ? 'one cut' : 'no file · ' + (f.h || 'host'));
    word.classList.toggle('nofile', !f.f);
  }
}

function buildFam(){
  FAMS.forEach(function(f, i){
    var d = document.createElement('div');
    d.className = 'it'; d.textContent = f.n;
    if (f.f) d.style.fontFamily = '"F ' + f.f + '", monospace';
    d.addEventListener('click', function(){ snapTo(famEl, d, 'left'); });
    famEl.appendChild(d);
  });
}

function markMid(wheel){
  var box = wheel.getBoundingClientRect();
  var cx = box.left + box.width / 2, cy = box.top + box.height / 2;
  var horizontal = wheel === famEl;
  var best = -1, bd = 1e9;
  [].forEach.call(wheel.children, function(el, i){
    var r = el.getBoundingClientRect();
    var d = horizontal ? Math.abs(r.left + r.width / 2 - cx) : Math.abs(r.top + r.height / 2 - cy);
    if (d < bd){ bd = d; best = i; }
  });
  [].forEach.call(wheel.children, function(el, i){ el.classList.toggle('mid', i === best); });
  return best;
}

function snapTo(wheel, el, axis){
  el.scrollIntoView({ behavior: 'smooth', block: axis === 'top' ? 'center' : 'nearest', inline: 'center' });
}

var tFam, tCut;
famEl.addEventListener('scroll', function(){
  clearTimeout(tFam);
  tFam = setTimeout(function(){
    if (lockFam) return;
    var i = markMid(famEl);
    if (i !== cur && i >= 0) setFam(i, true);
  }, 140);
}, { passive: true });
cutEl.addEventListener('scroll', function(){
  clearTimeout(tCut);
  tCut = setTimeout(function(){
    if (lockCut) return;
    var i = markMid(cutEl);
    if (i !== curCut && i >= 0) applyCut(i);
  }, 140);
}, { passive: true });

function setFam(i, fromWheel){
  cur = i;
  var f = fam(i);
  word.style.fontWeight = ''; word.style.fontStyle = ''; word.style.fontVariationSettings = '';
  word.style.fontFamily = famCss(f);
  word.textContent = f.f ? ptext.value || 'Shelf - 123' : f.n;
  mname.textContent = f.n;
  mhost.textContent = (f.l || '') + ' · ' + (f.h || '');
  mhost.href = f.u || '#';
  curCut = 0;
  buildCut();
  fitWord();
  if (f.f && document.fonts){
    document.fonts.load('400 100px "F ' + f.f + '"').then(fitWord);
    document.fonts.load('900 100px "F ' + f.f + '"').then(fitWord);
  }
  if (!fromWheel){
    lockFam = true;
    snapTo(famEl, famEl.children[i], 'left');
    setTimeout(function(){ lockFam = false; }, 500);
  }
}

ptext.addEventListener('input', function(){
  var f = fam(cur);
  word.textContent = f.f ? (ptext.value || 'Shelf - 123') : f.n;
  fitWord();
});
window.addEventListener('resize', fitWord);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitWord(); markMid(famEl); markMid(cutEl); });

buildFam();
setFam(0);
</script>
</body>
</html>
